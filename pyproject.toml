[project]
name = "semantic-search-system"
version = "1.0.1"
description = "Semantic search system based on NLP model"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Tihon Sotnikov" },
    { name = "Andrei Chervov" },
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "huggingface-hub>=1.12.0",
    "jinja2>=3.1.6",
    "numpy>=2.4.4",
    "python-multipart>=0.0.28",
    "sentence-transformers>=5.4.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "torch>=2.11.0",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
# Явный выбор сборки PyTorch. Без extra ставится сборка с PyPI.
cpu = ["torch>=2.11.0"]
cu126 = ["torch>=2.11.0"]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu126" },
    ],
]

[tool.uv.build-backend]
module-root = ""
module-name = "app"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ranx>=0.3.21",
    "ruff>=0.14.0",
]
docs = [
    "furo>=2025.9.25",
    "sphinx>=8.2.3",
    "sphinx-autodoc-typehints>=3.5.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
